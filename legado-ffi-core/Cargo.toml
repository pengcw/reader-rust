[package]
name = "reader-rust-ffi"
version = "1.1.1"
edition = "2021"

[features]
default = []
c-headers = ["safer-ffi/headers"]
kindle-eglibc-2-12 = ["rakers/kindle-eglibc-2-12"]

[lib]
name = "reader_parser"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate_headers"
path = "src/bin/generate_headers.rs"
required-features = ["c-headers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }
cookie_store = { version = "0.22", default-features = false, features = ["serde"] }
anyhow = "1"
aes = "0.8"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
chardetng = "0.1"
md-5 = "0.10"
ring = "0.17"
hex = "0.4"
scraper = "0.27"
ego-tree = "0.11"
rakers = { path = "vendor/rakers" }
jsonpath_lib = "0.3"
regex = "1"
java_regex = { path = "vendor/java_regex", version = "0.1.0" }
urlencoding = "2"
rand = "0.8"
base64 = "0.23"
url = "2"
sxd-xpath = "0.4"
sxd-document = "0.3"
safer-ffi = "0.1"
flate2 = "1.0"

[target.'cfg(any(all(target_arch = "aarch64", target_os = "linux"), all(target_arch = "arm", target_os = "linux"), target_os = "android"))'.dependencies]
rquickjs = { version = "=0.12.0", default-features = false, features = ["std", "bindgen"] }

[target.'cfg(not(any(all(target_arch = "aarch64", target_os = "linux"), all(target_arch = "arm", target_os = "linux"), target_os = "android")))'.dependencies]
rquickjs = { version = "=0.12.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

