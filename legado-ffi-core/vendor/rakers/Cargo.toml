[package]
edition = "2024"
name = "rakers"
version = "0.1.7"
authors = ["tbro <tim@toma.tl>"]
build = "build.rs"
exclude = [
    "TODO.org",
    "scripts/",
    ".claude/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Lightweight headless JS renderer — executes JavaScript and returns the rendered HTML"
homepage = "https://github.com/tbro/rakers"
documentation = "https://docs.rs/rakers"
readme = "README.md"
keywords = [
    "javascript",
    "headless",
    "renderer",
    "scraping",
    "html",
]
categories = [
    "web-programming",
    "command-line-utilities",
]
license = "MIT"
repository = "https://github.com/tbro/rakers"

[features]
cli = ["dep:clap", "diff"]
default = []
diff = ["dep:similar"]
kindle-eglibc-2-12 = []

[lib]
name = "rakers"
path = "src/lib.rs"

[[bin]]
name = "rakers"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

# P0 baseline is explicit because this vendored manifest uses autotests = false.
[[test]]
name = "async_http_p0_baseline"
path = "tests/async_http_p0_baseline.rs"

[[test]]
name = "async_http_p1_contracts"
path = "tests/async_http_p1_contracts.rs"

[build-dependencies]
serde_json = "1"
url = "2"

[target.'cfg(target_os = "android")'.build-dependencies]
rquickjs = { version = "=0.12.0", default-features = false, features = ["std", "bindgen"] }

[target.'cfg(not(target_os = "android"))'.build-dependencies]
rquickjs = { version = "=0.12.0", default-features = false, features = ["std"] }

[dependencies.anyhow]
version = "1"

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.html5ever]
version = "0.39"

[dependencies.markup5ever_rcdom]
version = "0.39.0+unofficial"

[dependencies.rquickjs]
version = "=0.12.0"
default-features = false
features = ["loader"]

[dependencies.scraper]
version = "0.27"

[dependencies.regex]
version = "1"

[dependencies.serde_json]
version = "1"

[dependencies.similar]
version = "2"
optional = true

[dependencies.ureq]
version = "3.4"
default-features = false
# reader-rust SO intentionally disables socks-proxy to reduce binary size.
# Its shared HttpClient rejects SOCKS; HTTP/HTTPS proxies remain supported.
# The standalone rakers ureq fallback must not receive SOCKS proxy URLs.
# To restore SOCKS, enable ureq/socks-proxy explicitly and review HttpClient's
# protocol guard plus proxy/transport contract tests; Cargo unifies features.
features = ["rustls", "gzip"]

[dependencies.url]
version = "2"

[dev-dependencies.assert_cmd]
version = "2"

[dev-dependencies.predicates]
version = "3"

[dev-dependencies.tempfile]
version = "3"
