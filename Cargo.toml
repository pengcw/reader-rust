[package]
name = "reader-rust-ffi"
version = "1.0.8"
edition = "2021"

[lib]
name = "reader_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "cookies", "gzip", "brotli", "deflate"] }
config = "0.14"
anyhow = "1"
aes = "0.8"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
hex = "0.4"
scraper = "0.20"
jsonpath_lib = "0.3"
regex = "1"
urlencoding = "2"
rand = "0.8"
once_cell = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
sxd-xpath = "0.4"
sxd-document = "0.3"
quick-xml = "0.31"
safer-ffi = { version = "0.1", features = ["headers"] }
flate2 = "1.0"

[target.'cfg(any(all(target_arch = "aarch64", target_os = "linux"), target_os = "android"))'.dependencies]
rquickjs = { version = "0.7", features = ["bindgen"] }

[target.'cfg(not(any(all(target_arch = "aarch64", target_os = "linux"), target_os = "android")))'.dependencies]
rquickjs = { version = "0.7" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

