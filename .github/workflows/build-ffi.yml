name: Build FFI Library

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: libreader_parser.so
            asset_name: libreader_parser-linux-x86_64.so
          - os: ubuntu-24.04-arm
            artifact_name: libreader_parser.so
            asset_name: libreader_parser-linux-aarch64.so
          - os: windows-latest
            artifact_name: reader_parser.dll
            asset_name: libreader_parser-windows-x86_64.dll
          - os: macos-latest
            artifact_name: libreader_parser.dylib
            asset_name: libreader_parser-macos-aarch64.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # rquickjs 在 aarch64-linux 上使用 bindgen 生成 FFI，需要 libclang
      - name: Install libclang (ARM64 Linux)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Build Library
        run: cargo build --release
        env:
          # 仅 aarch64-linux 的 bindgen 会读取；其他平台不受影响
          LIBCLANG_PATH: /usr/lib/llvm-18/lib

      - name: Rename Artifact
        shell: bash
        run: mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-parser-ffi-${{ matrix.os }}
          path: target/release/${{ matrix.asset_name }}
          if-no-files-found: error
