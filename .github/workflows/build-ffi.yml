name: Build & Release FFI Libraries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'test*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-linux-androideabi
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabi
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        include:
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            asset_name: legado_parser-android-armv7.so
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            asset_name: legado_parser-linux-armv7hf.so
            use_cross: false
          - target: armv7-unknown-linux-gnueabi
            os: ubuntu-latest
            asset_name: legado_parser-linux-armv7sf.so
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset_name: legado_parser-linux-aarch64.so
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: legado_parser-linux-x86_64.so
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: legado_parser-windows-x86_64.dll
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install libclang (ARM64 Linux)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install ARM cross compiler (Linux)
        if: matrix.use_cross == false && startsWith(matrix.target, 'armv7-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-arm-linux-gnueabi libclang-dev

      - name: Install Cross
        if: matrix.use_cross == true
        run: |
          mkdir -p ~/.cargo/bin
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin

      - name: Build Library (Cross)
        if: matrix.use_cross == true
        run: cross build --target ${{ matrix.target }} --release

      - name: Build Library (Cargo)
        if: matrix.use_cross == false
        run: cargo build --target ${{ matrix.target }} --release
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-gcc

      - name: Zip Artifact (Linux/Android)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f target/${{ matrix.target }}/release/libreader_parser.so ]; then
            mv target/${{ matrix.target }}/release/libreader_parser.so target/${{ matrix.target }}/release/${{ matrix.asset_name }}
            cd target/${{ matrix.target }}/release
            zip -9 "${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}"
          fi

      - name: Zip Artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -f target/${{ matrix.target }}/release/reader_parser.dll ]; then
            mv target/${{ matrix.target }}/release/reader_parser.dll target/${{ matrix.target }}/release/${{ matrix.asset_name }}
            cd target/${{ matrix.target }}/release
            zip -9 "${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reader-parser-ffi-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip
          if-no-files-found: warn

  publish-release:
    name: Publish Binaries to GitHub Release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: reader-parser-ffi-*
          merge-multiple: true
          path: artifacts

      - name: Create or Update Single GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: "Automated rolling release containing pre-compiled FFI parser binaries for all supported platforms."
          draft: false
          prerelease: false
          files: artifacts/*.zip
          fail_on_unmatched_files: false
