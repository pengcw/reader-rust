name: Build & Release FFI Libraries

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - armv7-linux-androideabi
          - aarch64-linux-android
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabi
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc

permissions:
  contents: write

# Serialize runs for a ref: an already-published version must never be replaced.
concurrency:
  group: ffi-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep build-std reproducible instead of following the moving nightly channel.
  RUST_NIGHTLY: nightly-2026-09-27

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-linux-androideabi
          - aarch64-linux-android
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        include:
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        uses: actions/checkout@v4

      - name: Setup Rust
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Cross
        if: >-
          matrix.use_cross == true &&
          (github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target)
        run: |
          mkdir -p ~/.cargo/bin
          cross_url=https://github.com/cross-rs/cross/releases/download/v0.2.5
          curl -L "$cross_url/cross-x86_64-unknown-linux-musl.tar.gz" |
            tar xz -C ~/.cargo/bin

      - name: Build Library (Cross)
        if: >-
          (github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target) &&
          matrix.use_cross == true
        run: cross build --target ${{ matrix.target }} --release --lib
        working-directory: legado-ffi-core
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS: >-
            -C link-arg=-Wl,--icf=all

      - name: Build Library (Cargo)
        if: >-
          (github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target) &&
          matrix.use_cross == false
        run: cargo build --target ${{ matrix.target }} --release --lib
        working-directory: legado-ffi-core

      - name: Zip Artifact (Linux/Android)
        if: >-
          runner.os == 'Linux' &&
          (github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target)
        shell: bash
        run: |
          artifact_dir="legado-ffi-core/target/${{ matrix.target }}/release"
          if [ -f "$artifact_dir/libreader_parser.so" ]; then
            cd "$artifact_dir"
            zip -9 legado_parser-${{ matrix.target }}.zip libreader_parser.so
          fi

      - name: Zip Artifact (Windows)
        if: >-
          runner.os == 'Windows' &&
          (github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target)
        shell: pwsh
        run: |
          $artifactDir = "legado-ffi-core/target/${{ matrix.target }}/release"
          $library = "$artifactDir/reader_parser.dll"
          if (Test-Path $library) {
            Set-Location $artifactDir
            $archive = "legado_parser-${{ matrix.target }}.zip"
            Compress-Archive -Path "reader_parser.dll" `
              -DestinationPath $archive -Force
          }

      - name: Upload Artifact
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        uses: actions/upload-artifact@v4
        with:
          name: reader-parser-ffi-${{ matrix.target }}
          path: legado-ffi-core/target/${{ matrix.target }}/release/*.zip
          if-no-files-found: error

  build-kindle:
    name: Build Kindle PW2+ (soft-float, old glibc)
    if: >-
      github.event.inputs.target == '' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'armv7-unknown-linux-gnueabi'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Building std against the same old sysroot is essential: linking only
      # the application against an old libc does not fix a newer prebuilt std.
      - name: Setup Rust and standard library sources
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src
          targets: armv7-unknown-linux-gnueabi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zstd libclang-dev clang binutils zip

      - name: Install pinned KOReader kindlepw2 toolchain
        run: |
          set -euo pipefail
          toolchain_url=https://github.com/koreader/koxtoolchain
          toolchain_path=releases/download/2026.08/kindlepw2.tar.zst
          archive="$RUNNER_TEMP/kindlepw2.tar.zst"
          curl --fail --location --retry 3 \
            "$toolchain_url/$toolchain_path" -o "$archive"
          sum=84bc8b4143796ba0c9e6306aefc596ca2e2685cf9174a285bb14f36425de8104
          echo "$sum  $archive" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/kindlepw2.tar.zst" -C "$HOME"
          tc="$HOME/x-tools/arm-kindlepw2-linux-gnueabi"
          cc="$tc/bin/arm-kindlepw2-linux-gnueabi-gcc"
          test -x "$cc"
          sysroot="$($cc -print-sysroot)"
          test -f "$sysroot/lib/libc-2.12.2.so"
          echo "Kindle toolchain sysroot: $sysroot"
          "$cc" -v 2>&1 | tail -1
          {
            echo "KO_SYSROOT=$sysroot"
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER=$cc"
            echo "CC_armv7_unknown_linux_gnueabi=$cc"
            ar="$tc/bin/arm-kindlepw2-linux-gnueabi-ar"
            echo "AR_armv7_unknown_linux_gnueabi=$ar"
            bindgen_args="--target=armv7-unknown-linux-gnueabi"
            bindgen_args+=" --sysroot=$sysroot"
            echo "BINDGEN_EXTRA_CLANG_ARGS=$bindgen_args"
          } >> "$GITHUB_ENV"

      - name: Build Kindle library and target std
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_RUSTFLAGS: >-
            -C link-arg=-Wl,-z,defs
        run: |
          cargo +"${RUST_NIGHTLY}" build --locked --release --lib \
            --target armv7-unknown-linux-gnueabi \
            --features kindle-eglibc-2-12 \
            -Z build-std=std,panic_abort
        working-directory: legado-ffi-core

      - name: Reject incompatible ELF before packaging
        run: |
          python3 scripts/check-ereader-elf.py \
            target/armv7-unknown-linux-gnueabi/release/libreader_parser.so \
            --target armv7-unknown-linux-gnueabi --sysroot "$KO_SYSROOT"
        working-directory: legado-ffi-core

      - name: Package Kindle library
        run: |
          cd target/armv7-unknown-linux-gnueabi/release
          zip -9 legado_parser-armv7-unknown-linux-gnueabi.zip \
            libreader_parser.so
        working-directory: legado-ffi-core

      - name: Upload Kindle artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-parser-ffi-armv7-unknown-linux-gnueabi
          path: legado-ffi-core/target/armv7-unknown-linux-gnueabi/release/*.zip
          if-no-files-found: error

  build-ereader:
    name: Build KOReader ${{ matrix.toolchain }} (${{ matrix.target }})
    if: >-
      github.event.inputs.target == '' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'armv7-unknown-linux-gnueabihf' ||
      github.event.inputs.target == 'aarch64-unknown-linux-gnu'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # armv7 hard-float: Kobo's original toolchain targets
          # the oldest Kobo ABI.
          - target: armv7-unknown-linux-gnueabihf
            toolchain: kobo
            prefix: arm-kobo-linux-gnueabihf
            sha256: >-
              326dd2a2a5ca371073c4ebc783d578f93f4122d83c46b84ec85b9e3ed5ff2305
          # aarch64 embedded Linux: KOReader's reMarkable arm64 toolchain.
          - target: aarch64-unknown-linux-gnu
            toolchain: remarkable-aarch64
            prefix: aarch64-remarkable-linux-gnu
            sha256: >-
              4b00e0351a702d37be5ae660d9077d9ae3da22e5145e28d8089f193f325f446a
    steps:
      - name: Checkout repository
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        uses: actions/checkout@v4

      - name: Setup Rust with standard library sources
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zstd libclang-dev clang binutils zip

      - name: Install pinned KOReader e-ink toolchain
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.toolchain }}.tar.zst"
          toolchain_url=https://github.com/koreader/koxtoolchain
          toolchain_path=releases/download/2026.08
          archive_name="${{ matrix.toolchain }}.tar.zst"
          download_url="$toolchain_url/$toolchain_path/$archive_name"
          curl --fail --location --retry 3 \
            "$download_url" -o "$archive"
          echo '${{ matrix.sha256 }}  '"$archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$HOME"
          tc="$HOME/x-tools/${{ matrix.prefix }}"
          cc="$tc/bin/${{ matrix.prefix }}-gcc"
          test -x "$cc"
          sysroot="$($cc -print-sysroot)"
          test -f "$sysroot/lib/libc.so.6"
          echo "KOReader sysroot: $sysroot"
          "$cc" -v 2>&1 | tail -1
          target_var='${{ matrix.target }}'
          target_var="${target_var//-/_}"
          {
            echo "KO_SYSROOT=$sysroot"
            echo "CARGO_TARGET_${target_var^^}_LINKER=$cc"
            echo "CC_${target_var}=$cc"
            echo "AR_${target_var}=$tc/bin/${{ matrix.prefix }}-ar"
            bindgen_args="--target=${{ matrix.target }}"
            bindgen_args+=" --sysroot=$sysroot"
            echo "BINDGEN_EXTRA_CLANG_ARGS=$bindgen_args"
          } >> "$GITHUB_ENV"

      - name: Build library and target std
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        run: |
          cargo +"${RUST_NIGHTLY}" build --locked --release --lib \
            --target '${{ matrix.target }}' \
            -Z build-std=std,panic_abort
        working-directory: legado-ffi-core

      - name: Reject incompatible ELF before packaging
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        run: |
          python3 scripts/check-ereader-elf.py \
            target/${{ matrix.target }}/release/libreader_parser.so \
            --target '${{ matrix.target }}' --sysroot "$KO_SYSROOT"
        working-directory: legado-ffi-core

      - name: Package e-ink library
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        run: |
          cd target/${{ matrix.target }}/release
          zip -9 legado_parser-${{ matrix.target }}.zip libreader_parser.so
        working-directory: legado-ffi-core

      - name: Upload e-ink artifact
        if: >-
          github.event.inputs.target == '' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == matrix.target
        uses: actions/upload-artifact@v4
        with:
          name: reader-parser-ffi-${{ matrix.target }}
          path: legado-ffi-core/target/${{ matrix.target }}/release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Immutable Versioned Release
    needs: [build, build-kindle, build-ereader]
    if: >-
      ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      needs['build-kindle'].result == 'success' &&
      needs['build-ereader'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version and release immutability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^version =' legado-ffi-core/Cargo.toml | cut -d '"' -f 2)
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match Cargo version $version"
            exit 1
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $version already exists; publish a new version instead"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: reader-parser-ffi-*
          merge-multiple: true
          path: artifacts

      - name: Prepare versioned release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_zips
          shopt -s nullglob
          for file in artifacts/*.zip artifacts/*/*.zip; do
            cp "$file" release_zips/
          done

          # Never mix binaries from another run or publish an incomplete platform set.
          targets=(
            armv7-linux-androideabi
            aarch64-linux-android
            x86_64-unknown-linux-gnu
            x86_64-pc-windows-msvc
            armv7-unknown-linux-gnueabi
            armv7-unknown-linux-gnueabihf
            aarch64-unknown-linux-gnu
          )
          for target in "${targets[@]}"; do
            zip="release_zips/legado_parser-${target}.zip"
            if [[ ! -s "$zip" ]]; then
              echo "::error::Missing release asset: $zip"
              exit 1
            fi
          done
          archives=(release_zips/*.zip)
          if [[ "${#archives[@]}" -ne "${#targets[@]}" ]]; then
            echo "::error::Unexpected release asset count: ${#archives[@]}"
            exit 1
          fi

          # Each archive and manifest belongs exclusively to this version's tag.
          cd release_zips
          printf '{\n  "version": "%s",\n' "$GITHUB_REF_NAME" > manifest.json
          printf '  "build_time": "%s",\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> manifest.json
          printf '  "checksums": {\n' >> manifest.json
          first=true
          for zip in *.zip; do
            if [[ "$first" == true ]]; then
              first=false
            else
              printf ',\n' >> manifest.json
            fi
            printf '    "%s": "%s"' "$zip" "$(sha256sum "$zip" | cut -d ' ' -f 1)" >> manifest.json
          done
          printf '\n  }\n}\n' >> manifest.json

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Local Parser Extension ${{ github.ref_name }}
          body: >-
            Immutable FFI parser binaries built together from tag ${{ github.ref_name }}.
            Each platform archive is recorded in manifest.json with its SHA256.
          draft: false
          prerelease: false
          # Legacy Lua plugins use /releases/latest/download; never redirect them to a versioned release.
          make_latest: false
          files: |
            release_zips/*.zip
            release_zips/manifest.json
          fail_on_unmatched_files: true
