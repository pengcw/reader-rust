name: Build & Release FFI Libraries

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - armv7-linux-androideabi
          - aarch64-linux-android
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabi
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-linux-androideabi
          - aarch64-linux-android
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        include:
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross == true && (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)
        run: |
          mkdir -p ~/.cargo/bin
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin

      - name: Build Library (Cross)
        if: (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target) && matrix.use_cross == true
        run: cross build --target ${{ matrix.target }} --release --lib
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS: "-C link-arg=-Wl,--icf=all"

      - name: Build Library (Cargo)
        if: (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target) && matrix.use_cross == false
        run: cargo build --target ${{ matrix.target }} --release --lib

      - name: Zip Artifact (Linux/Android)
        if: runner.os == 'Linux' && (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)
        shell: bash
        run: |
          if [ -f target/${{ matrix.target }}/release/libreader_parser.so ]; then
            cd target/${{ matrix.target }}/release
            zip -9 legado_parser-${{ matrix.target }}.zip libreader_parser.so
          fi

      - name: Zip Artifact (Windows)
        if: runner.os == 'Windows' && (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)
        shell: pwsh
        run: |
          if (Test-Path "target/${{ matrix.target }}/release/reader_parser.dll") {
            cd "target/${{ matrix.target }}/release"
            Compress-Archive -Path "reader_parser.dll" -DestinationPath "legado_parser-${{ matrix.target }}.zip" -Force
          }

      - name: Upload Artifact
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        uses: actions/upload-artifact@v4
        with:
          name: reader-parser-ffi-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/legado_parser-${{ matrix.target }}.zip
          if-no-files-found: error

  build-kindle:
    name: Build Kindle PW2+ (soft-float, old glibc)
    if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'armv7-unknown-linux-gnueabi'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Building std against the same old sysroot is essential: linking only
      # the application against an old libc does not fix a newer prebuilt std.
      - name: Setup Rust and standard library sources
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: armv7-unknown-linux-gnueabi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd libclang-dev clang binutils zip

      - name: Install pinned KOReader kindlepw2 toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/koreader/koxtoolchain/releases/download/2026.08/kindlepw2.tar.zst' \
            -o "$RUNNER_TEMP/kindlepw2.tar.zst"
          echo '84bc8b4143796ba0c9e6306aefc596ca2e2685cf9174a285bb14f36425de8104  '"$RUNNER_TEMP/kindlepw2.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/kindlepw2.tar.zst" -C "$HOME"
          tc="$HOME/x-tools/arm-kindlepw2-linux-gnueabi"
          cc="$tc/bin/arm-kindlepw2-linux-gnueabi-gcc"
          test -x "$cc"
          sysroot="$($cc -print-sysroot)"
          test -f "$sysroot/lib/libc-2.12.2.so"
          echo "Kindle toolchain sysroot: $sysroot"
          "$cc" -v 2>&1 | tail -1
          {
            echo "KO_SYSROOT=$sysroot"
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER=$cc"
            echo "CC_armv7_unknown_linux_gnueabi=$cc"
            echo "AR_armv7_unknown_linux_gnueabi=$tc/bin/arm-kindlepw2-linux-gnueabi-ar"
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=armv7-unknown-linux-gnueabi --sysroot=$sysroot"
          } >> "$GITHUB_ENV"

      - name: Build Kindle library and target std
        run: |
          cargo +nightly build --locked --release --lib \
            --target armv7-unknown-linux-gnueabi \
            -Z build-std=std,panic_abort

      - name: Reject incompatible ELF before packaging
        run: |
          python3 scripts/check-ereader-elf.py \
            target/armv7-unknown-linux-gnueabi/release/libreader_parser.so \
            --target armv7-unknown-linux-gnueabi --sysroot "$KO_SYSROOT"

      - name: Package Kindle library
        run: |
          cd target/armv7-unknown-linux-gnueabi/release
          zip -9 legado_parser-armv7-unknown-linux-gnueabi.zip libreader_parser.so

      - name: Upload Kindle artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-parser-ffi-armv7-unknown-linux-gnueabi
          path: target/armv7-unknown-linux-gnueabi/release/legado_parser-armv7-unknown-linux-gnueabi.zip
          if-no-files-found: error

  build-ereader:
    name: Build KOReader ${{ matrix.toolchain }} (${{ matrix.target }})
    if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == 'armv7-unknown-linux-gnueabihf' || github.event.inputs.target == 'aarch64-unknown-linux-gnu'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # armv7 hard-float: Kobo's original toolchain targets the oldest Kobo ABI.
          - target: armv7-unknown-linux-gnueabihf
            toolchain: kobo
            prefix: arm-kobo-linux-gnueabihf
            sha256: 326dd2a2a5ca371073c4ebc783d578f93f4122d83c46b84ec85b9e3ed5ff2305
          # aarch64 embedded Linux: KOReader's reMarkable arm64 toolchain.
          - target: aarch64-unknown-linux-gnu
            toolchain: remarkable-aarch64
            prefix: aarch64-remarkable-linux-gnu
            sha256: 4b00e0351a702d37be5ae660d9077d9ae3da22e5145e28d8089f193f325f446a
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust with standard library sources
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd libclang-dev clang binutils zip

      - name: Install pinned KOReader e-ink toolchain
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.toolchain }}.tar.zst"
          curl --fail --location --retry 3 \
            'https://github.com/koreader/koxtoolchain/releases/download/2026.08/${{ matrix.toolchain }}.tar.zst' \
            -o "$archive"
          echo '${{ matrix.sha256 }}  '"$archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$HOME"
          tc="$HOME/x-tools/${{ matrix.prefix }}"
          cc="$tc/bin/${{ matrix.prefix }}-gcc"
          test -x "$cc"
          sysroot="$($cc -print-sysroot)"
          test -f "$sysroot/lib/libc.so.6"
          echo "KOReader sysroot: $sysroot"
          "$cc" -v 2>&1 | tail -1
          target_var='${{ matrix.target }}'
          target_var="${target_var//-/_}"
          {
            echo "KO_SYSROOT=$sysroot"
            echo "CARGO_TARGET_${target_var^^}_LINKER=$cc"
            echo "CC_${target_var}=$cc"
            echo "AR_${target_var}=$tc/bin/${{ matrix.prefix }}-ar"
            echo "BINDGEN_EXTRA_CLANG_ARGS=--target=${{ matrix.target }} --sysroot=$sysroot"
          } >> "$GITHUB_ENV"

      - name: Build library and target std
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        run: |
          cargo +nightly build --locked --release --lib \
            --target '${{ matrix.target }}' \
            -Z build-std=std,panic_abort

      - name: Reject incompatible ELF before packaging
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        run: |
          python3 scripts/check-ereader-elf.py \
            target/${{ matrix.target }}/release/libreader_parser.so \
            --target '${{ matrix.target }}' --sysroot "$KO_SYSROOT"

      - name: Package e-ink library
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        run: |
          cd target/${{ matrix.target }}/release
          zip -9 legado_parser-${{ matrix.target }}.zip libreader_parser.so

      - name: Upload e-ink artifact
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        uses: actions/upload-artifact@v4
        with:
          name: reader-parser-ffi-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/legado_parser-${{ matrix.target }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish Binaries to GitHub Release
    needs: [build, build-kindle, build-ereader]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && (needs['build-kindle'].result == 'success' || needs['build-kindle'].result == 'skipped') && (needs['build-ereader'].result == 'success' || needs['build-ereader'].result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: reader-parser-ffi-*
          merge-multiple: true
          path: artifacts


      - name: Prepare releases
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release_zips
          shopt -s nullglob

          # 1) Merge the already-published zips first, then overlay this run's
          #    binaries so the manifest always covers every asset on the rolling
          #    release, with same-name assets from this run taking precedence.
          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' \
            --dir release_zips \
            --clobber || true

          # 2) Collect the zips built in this run (overwrite same-name ones).
          local_count=0
          for file in artifacts/*.zip artifacts/*/*.zip; do
            if [ -f "$file" ]; then
              cp -f "$file" release_zips/
              local_count=$((local_count + 1))
            fi
          done

          # 3) Nothing produced in this run: leave the online release untouched
          #    (avoids overwriting manifest.json with an empty checksums map).
          if [ "$local_count" -eq 0 ]; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No binaries produced in this run, skipping release update."
            exit 0
          fi

          # Extract version from Cargo.toml
          CARGO_VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          VERSION="${CARGO_VERSION:-${GITHUB_REF_NAME:-latest}}"

          # Generate manifest.json with SHA256 of each downloadable ZIP archive.
          # Update.lua validates checksums[zip_name] before extraction.
          cd release_zips
          echo "{" > manifest.json
          echo '  "version": "'$VERSION'",' >> manifest.json
          echo '  "build_time": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",' >> manifest.json
          echo '  "checksums": {' >> manifest.json

          first=true
          for zip in *.zip; do
             if [ -f "$zip" ]; then
               hash=$(sha256sum "$zip" | awk '{print $1}')
               if [ "$first" = true ]; then
                   first=false
               else
                   echo ',' >> manifest.json
               fi
               echo -n '    "'$zip'": "'$hash'"' >> manifest.json
             fi
          done

          echo '' >> manifest.json
          echo '  }' >> manifest.json
          echo "}" >> manifest.json
          cd ..

      - name: Create or Update Single GitHub Release
        if: steps.prepare.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Local Parser Extension
          body: "Automated rolling release containing pre-compiled FFI parser binaries for all supported platforms."
          draft: false
          prerelease: false
          files: |
            release_zips/*.zip
            release_zips/manifest.json
          fail_on_unmatched_files: false
