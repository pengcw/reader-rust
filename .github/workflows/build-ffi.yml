name: Build & Release FFI Libraries

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - armv7-linux-androideabi
          - aarch64-linux-android
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabi
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-linux-androideabi
          - aarch64-linux-android
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabi
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        include:
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            use_cross: false
          - target: armv7-unknown-linux-gnueabi
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install libclang (ARM64 Linux)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install ARM cross compiler (Linux)
        if: matrix.use_cross == false && startsWith(matrix.target, 'armv7-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-arm-linux-gnueabi libclang-dev

      - name: Install Cross
        if: matrix.use_cross == true
        run: |
          mkdir -p ~/.cargo/bin
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin

      - name: Build Library (Cross)
        if: (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target) && matrix.use_cross == true
        run: cross build --target ${{ matrix.target }} --release --lib
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS: "-C link-arg=-Wl,--icf=all"

      - name: Build Library (Cargo)
        if: (github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target) && matrix.use_cross == false
        run: cargo build --target ${{ matrix.target }} --release --lib
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-gcc

      - name: Zip Artifact (Linux/Android)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f target/${{ matrix.target }}/release/libreader_parser.so ]; then
            cd target/${{ matrix.target }}/release
            zip -9 legado_parser-${{ matrix.target }}.zip libreader_parser.so
          fi

      - name: Zip Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "target/${{ matrix.target }}/release/reader_parser.dll") {
            cd "target/${{ matrix.target }}/release"
            Compress-Archive -Path "reader_parser.dll" -DestinationPath "legado_parser-${{ matrix.target }}.zip" -Force
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reader-parser-ffi-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/legado_parser-${{ matrix.target }}.zip
          if-no-files-found: warn

  publish-release:
    name: Publish Binaries to GitHub Release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: reader-parser-ffi-*
          merge-multiple: true
          path: artifacts


      - name: Prepare releases
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release_zips
          shopt -s nullglob

          # 1) Merge the already-published zips first, then overlay this run's
          #    binaries so the manifest always covers every asset on the rolling
          #    release, with same-name assets from this run taking precedence.
          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' \
            --dir release_zips \
            --clobber || true

          # 2) Collect the zips built in this run (overwrite same-name ones).
          local_count=0
          for file in artifacts/*.zip artifacts/*/*.zip; do
            if [ -f "$file" ]; then
              cp -f "$file" release_zips/
              local_count=$((local_count + 1))
            fi
          done

          # 3) Nothing produced in this run: leave the online release untouched
          #    (avoids overwriting manifest.json with an empty checksums map).
          if [ "$local_count" -eq 0 ]; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No binaries produced in this run, skipping release update."
            exit 0
          fi

          # Extract version from Cargo.toml
          CARGO_VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          VERSION="${CARGO_VERSION:-${GITHUB_REF_NAME:-latest}}"

          # Generate manifest.json with SHA256 of each downloadable ZIP archive.
          # Update.lua validates checksums[zip_name] before extraction.
          cd release_zips
          echo "{" > manifest.json
          echo '  "version": "'$VERSION'",' >> manifest.json
          echo '  "build_time": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",' >> manifest.json
          echo '  "checksums": {' >> manifest.json

          first=true
          for zip in *.zip; do
             if [ -f "$zip" ]; then
               hash=$(sha256sum "$zip" | awk '{print $1}')
               if [ "$first" = true ]; then
                   first=false
               else
                   echo ',' >> manifest.json
               fi
               echo -n '    "'$zip'": "'$hash'"' >> manifest.json
             fi
          done

          echo '' >> manifest.json
          echo '  }' >> manifest.json
          echo "}" >> manifest.json
          cd ..

      - name: Create or Update Single GitHub Release
        if: steps.prepare.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Local Parser Extension
          body: "Automated rolling release containing pre-compiled FFI parser binaries for all supported platforms."
          draft: false
          prerelease: false
          files: |
            release_zips/*.zip
            release_zips/manifest.json
          fail_on_unmatched_files: false
